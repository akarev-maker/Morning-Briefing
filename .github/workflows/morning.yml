name: Morning Briefing

on:
  schedule:
    # 12:00 UTC = 7 AM EST / 8 AM EDT. GitHub delays scheduled runs when it is
    # busy, sometimes by hours, so this is the earliest it will arrive.
    - cron: "0 12 * * *"
  # Run on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open an alert issue if a run fails

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # Actions are pinned to commit SHAs so a hijacked tag can't change what
        # runs here. Dependabot proposes updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send briefing
        # A step timeout counts as a failure, which the alert step below catches.
        # The job-level timeout counts as "cancelled", which it previously missed.
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python briefing.py

      # Backstop for failures the in-app alert email can't report (SMTP down,
      # the job hanging until it times out).
      - name: Open alert issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Morning briefing failed: $(date -u +%Y-%m-%d)" \
            --body "The scheduled briefing run failed or timed out. Logs: $RUN_URL" \
            || echo "Could not open alert issue."
